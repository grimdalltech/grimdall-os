[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grimdall"
version = "0.3.0"
description = "Python SDK for checking AI agent tool calls with Grimdall."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "Grimdall Technologies" }
]
keywords = ["ai", "agents", "guardrails", "security", "grimdall"]
dependencies = [
  "requests>=2.31.0"
]

[project.urls]
Homepage = "https://grimdall.com"
Repository = "https://github.com/grimdalltech/grimdall-os"
