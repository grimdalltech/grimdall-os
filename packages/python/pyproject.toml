[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grimdall"
version = "0.3.3"
description = "One decorator. Any framework. Zero infra. Local-only runtime guardrails for AI agent tool calls."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["cryptography>=43.0"]
keywords = [
    "ai",
    "agents",
    "guardrails",
    "security",
    "llm",
    "langchain",
    "crewai",
    "autogen",
    "openai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1"]
openai-agents = ["openai-agents>=0.1"]
crewai = ["crewai>=0.80"]
autogen = ["autogen-agentchat>=0.2"]
all = ["langchain-core>=0.1", "openai-agents>=0.1", "crewai>=0.80", "autogen-agentchat>=0.2"]

[tool.setuptools.packages.find]
include = ["grimdall*"]

[tool.setuptools.package-data]
grimdall = ["py.typed"]
