  <circle cx="555" cy="230" r="3" fill="#ffffff"/>
  <circle cx="645" cy="225" r="3" fill="#ffffff"/>
  <circle cx="580" cy="260" r="2.5" fill="#ffffff"/>
  <circle cx="620" cy="255" r="2.5" fill="#ffffff"/>
  <circle cx="600" cy="290" r="2.5" fill="#ffffff"/>
  <!-- Constellation lines -->
  <line x1="600" y1="120" x2="560" y2="150" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
  <line x1="600" y1="120" x2="640" y2="145" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
