  <line x1="555" y1="230" x2="580" y2="260" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
  <line x1="645" y1="225" x2="620" y2="255" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
